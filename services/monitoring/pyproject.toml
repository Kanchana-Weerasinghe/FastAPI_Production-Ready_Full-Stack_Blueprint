[project]
name = "monitoring"
version = "0.1.0"
description = "Monitoring domain service: owns its business rules (see README.md)."
requires-python = ">=3.12"
dependencies = [
    "platform-kit",
    "alembic>=1.18.4",
    "dependency-injector>=4.49.0",
    "fastapi[standard]>=0.135.3",
    "gunicorn>=23",
    "slowapi>=0.1.9",
    "uvicorn>=0.44.0",
]

[tool.uv.sources]
platform-kit = { path = "../../packages/platform-kit", editable = true }
codegraphs = { path = "../../../codegraphs", editable = true }

[dependency-groups]
dev = [
    "codegraphs",
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.2",
    "ruff>=0.15.10",
    "taskipy>=1.14.0",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12",
]

[tool.taskipy.tasks]
dev = "fastapi dev app/main.py --port 8010"
openapi = "python scripts/export_openapi.py"
check-access = "python scripts/check_access.py"
upgrade = "alembic upgrade head"
downgrade = "alembic downgrade -1"
format = "ruff format . && ruff check --fix ."
check = "ruff check . && ruff format --check ."
type-check = "mypy ."
test = "pytest -v"
test-br = "pytest tests/business_rules -v"
cov = "pytest --cov=app --cov-report=term-missing"
cov-html = "pytest --cov=app --cov-report=html"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "PT"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"app/core/security.py" = ["ARG001"]
"app/modules/*/router.py" = ["ARG001"]
"tests/conftest.py" = ["E402"]
"tests/**/conftest.py" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["migrations/"]
