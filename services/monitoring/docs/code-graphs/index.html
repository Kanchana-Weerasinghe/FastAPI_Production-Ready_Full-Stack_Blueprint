const STORAGE_KEY = "codegraphs-tab:" + TITLE;

document.title = TITLE;
document.getElementById("title").textContent = TITLE;

const stage = document.getElementById("stage");
const panel = document.getElementById("panel");
const legend = document.getElementById("legend");
const tabsEl = document.getElementById("tabs");
const search = document.getElementById("search");
let cur = null, svg = null, vb = null, home = null, adj = null;

function remember(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

DATA.forEach(t => {
  const b = document.createElement("button");
  b.textContent = t.label; b.role = "tab"; b.dataset.id = t.id;
  b.onclick = () => show(t.id);
  tabsEl.appendChild(b);
});

function show(id) {
  cur = DATA.find(t => t.id === id) || DATA[0];
  remember(STORAGE_KEY, cur.id);
  [...tabsEl.children].forEach(b => b.setAttribute("aria-selected", b.dataset.id === cur.id));
  stage.querySelector("svg")?.remove();
  stage.insertAdjacentHTML("afterbegin", cur.svg);
  svg = stage.querySelector("svg");
  svg.removeAttribute("width"); svg.removeAttribute("height");
  svg.querySelectorAll("title").forEach(t => t.remove()); // native tooltips fight the panel
  const [x, y, w, h] = svg.getAttribute("viewBox").split(/\s+/).map(Number);
  home = { x, y, w, h }; fit();
  adj = { out: {}, in: {} };
  for (const [eid, [a, b, ind]] of Object.entries(cur.meta.edges)) {
    (adj.out[a] ||= []).push({ eid, other: b, ind });
    (adj.in[b] ||= []).push({ eid, other: a, ind });
  }
  svg.querySelectorAll("g.node").forEach(g => {
    if (cur.meta.nodes[g.id]) g.addEventListener("click", ev => { ev.stopPropagation(); select(g.id, false); });
  });
  search.value = ""; search.disabled = cur.meta.kind === "overview" && !Object.keys(cur.meta.nodes).length;
  legend.innerHTML = cur.id === "overview"
    ? "<b>Layer → layer.</b> Number = how many distinct calls cross that boundary."
    : "<b>Click a function</b> to see what it calls and what calls it. Scroll to zoom, drag to pan." +
      "<br><span class='swatch'></span>direct call<span class='swatch dashed'></span>indirect (registry / background task / passed by reference)";
  intro();
}

function intro() {
  svg?.classList.remove("focus");
  svg?.querySelectorAll(".hl,.sel").forEach(e => e.classList.remove("hl", "sel"));
  const n = Object.keys(cur.meta.nodes).length;
  panel.innerHTML = `<h2>${esc(cur.meta.title)}</h2><p>${esc(cur.meta.description || "")}</p>` +
    (n ? `<p><span class="tag">${n} ${cur.meta.kind === "modules" ? "files" : "functions"}</span> <span class="tag">${Object.keys(cur.meta.edges).length} ${cur.meta.kind === "modules" ? "imports" : "calls"}</span></p>
          ${cur.meta.kind === "modules" ? "" : `<h3>Start here</h3><ul>${Object.entries(cur.meta.nodes).filter(([, m]) => m.entry)
            .map(([id, m]) => item(id, m)).join("")}</ul>`}
          <h3>How to read it</h3><p>Boxes are functions, grouped by file (dashed outline) and by architecture layer (coloured area). The thick-bordered box is where the request enters. Click any box to focus on its neighbours and open the code in VS Code.</p>` : "");
  bindList();
}

function select(id, centre) {
  const m = cur.meta.nodes[id], isMod = cur.meta.kind === "modules";
  svg.classList.add("focus");
  svg.querySelectorAll(".hl,.sel").forEach(e => e.classList.remove("hl", "sel"));
  const mark = i => svg.getElementById(i)?.classList.add("hl");
  mark(id); svg.getElementById(id).classList.add("sel");
  const outs = adj.out[id] || [], ins = adj.in[id] || [];
  [...outs, ...ins].forEach(e => { mark(e.eid); mark(e.other); });
  const list = arr => arr.length
    ? `<ul>${arr.map(e => item(e.other, cur.meta.nodes[e.other], e.ind)).join("")}</ul>`
    : "<p>None in this flow.</p>";
  panel.innerHTML = `<p><a href="#" id="back">← Flow overview</a></p>
    <h2>${esc(m.name)}${isMod ? ".py" : "()"}</h2>
    <p>${esc(m.layer)}<br><code>${esc(m.file)}:${m.line}</code><br>
    <a class="open" href="vscode://file/${encodeURI(m.abs)}:${m.line}">Open in VS Code ↗</a></p>
    <h3>${isMod ? "Imports" : "Calls"} (${outs.length})</h3>${list(outs)}
    <h3>${isMod ? "Imported by" : "Called by"} (${ins.length})</h3>${list(ins)}`;
  document.getElementById("back").onclick = ev => { ev.preventDefault(); intro(); };
  bindList();
  if (centre) centreOn(id);
}

function item(id, m, ind) {
  const suffix = cur.meta.kind === "modules" ? ".py" : "()";
  return `<li data-id="${id}">${esc(m.name)}${suffix}${ind ? ' <span class="ind">indirect</span>' : ""}<small>${esc(m.module)}</small></li>`;

function setVB(v) { vb = v; svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`); }

  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  if (!drag.moved) { drag.moved = true; stage.classList.add("dragging"); stage.setPointerCapture?.(ev.pointerId); }

stage.addEventListener("click", ev => { if (drag?.moved) { ev.stopPropagation(); return; } if (cur.id !== "overview") intro(); }, true);
document.getElementById("fit").onclick = fit;
document.addEventListener("keydown", ev => { if (ev.key === "Escape") { intro(); fit(); } });

search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  svg.querySelectorAll("g.node.hit").forEach(g => g.classList.remove("hit"));
  if (!q) return;
  const hits = Object.entries(cur.meta.nodes).filter(([, m]) => (m.name + " " + m.module).toLowerCase().includes(q));
  hits.forEach(([id]) => svg.getElementById(id)?.classList.add("hit"));
  if (hits.length === 1) select(hits[0][0], true);

  if (!tab) return false;
  show(tab);
  const hit = fn && Object.entries(cur.meta.nodes).find(([, m]) => m.name === fn);
  if (hit) select(hit[0], true);
  return true;
}
window.addEventListener("hashchange", fromHash);
if (!fromHash()) show(recall(STORAGE_KEY) || DATA[0].id);
</script>
