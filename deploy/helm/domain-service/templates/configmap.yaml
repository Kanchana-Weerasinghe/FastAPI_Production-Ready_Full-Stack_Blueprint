{{- include "svc.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "svc.name" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
data:
  SERVICE_NAME: {{ include "svc.name" . | quote }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
