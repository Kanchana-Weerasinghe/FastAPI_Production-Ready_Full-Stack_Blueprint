{{- if .Values.migrations.enabled }}
# Runs before every install/upgrade with the schema-owner role. If it fails, Helm aborts the release
# and the previous version keeps serving (migrations must be backward compatible).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "svc.name" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "svc.selector" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "svc.name" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "svc.image" . }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            # The hook runs before the release's ConfigMap exists, so config is passed explicitly.
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.config.ENVIRONMENT | quote }}
            - name: DB_SCHEMA
              value: {{ .Values.config.DB_SCHEMA | quote }}
            - name: PROBLEM_TYPE_BASE_URI
              value: {{ .Values.config.PROBLEM_TYPE_BASE_URI | quote }}
            # Migrations run as the schema owner, not the runtime role.
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: MIGRATION_DB_USERNAME}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: MIGRATION_DB_PASSWORD}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
