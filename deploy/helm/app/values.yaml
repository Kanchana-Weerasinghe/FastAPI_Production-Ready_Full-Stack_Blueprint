# Defaults are production-shaped; environment files (values-staging.yaml, values-production.yaml)
# override sizes and hosts. Secrets are never stored here: reference an existing Secret (created by
# External Secrets Operator / Sealed Secrets / your CD tool from the cloud secrets manager).

image:
  # Images are built once per commit and promoted by digest/tag through environments.
  api:
    repository: ghcr.io/your-org/your-repo/api
    tag: ""            # defaults to .Chart.AppVersion; set by the release pipeline
    digest: ""         # prefer digests in production (immutable)
  web:
    repository: ghcr.io/your-org/your-repo/web
    tag: ""
    digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Non-secret configuration (rendered into a ConfigMap, consumed with envFrom).
config:
  ENVIRONMENT: production
  APP_DOMAIN: app.example.com
  CORS_ORIGINS: https://app.example.com
  FRONTEND_URL: https://app.example.com
  TRUSTED_PROXIES: 10.0.0.0/8
  STORAGE_BACKEND: s3
  S3_BUCKET: your-app-uploads
  S3_REGION: eu-west-1
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: api
  OTEL_TRACES_SAMPLE_RATIO: "0.05"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  LOG_LEVEL: INFO
  WEB_CONCURRENCY: "2"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"

# Name of an existing Secret holding SECRET_KEY, FIELD_ENCRYPTION_KEY, DB_HOST, DB_USERNAME,
# DB_PASSWORD, DB_NAME, REDIS_URL, RATE_LIMIT_STORAGE_URI, SENTRY_DSN, AUTOSEND_API_KEY, METRICS_TOKEN,
# and for the migration job MIGRATION_DB_USERNAME / MIGRATION_DB_PASSWORD.
existingSecret: app-secrets

serviceAccount:
  create: true
  # e.g. eks.amazonaws.com/role-arn for IRSA (S3 access without static keys)
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

api:
  replicas: 3
  resources:
    requests: {cpu: 250m, memory: 384Mi}
    limits: {memory: 768Mi}
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 65
  pdb:
    minAvailable: 2
  # Must exceed gunicorn --graceful-timeout (25s) plus the preStop drain.
  terminationGracePeriodSeconds: 40
  preStopSleepSeconds: 10

worker:
  enabled: true
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  terminationGracePeriodSeconds: 60

web:
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}
  env:
    # Same-origin API (served via the ingress), so the CSP only needs 'self'.
    API_ORIGIN: "'self'"

migrations:
  # Runs `alembic upgrade head` as a pre-install/pre-upgrade hook with the migration role.
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 600

ingress:
  enabled: true
  className: nginx
  host: app.example.com
  tlsSecretName: app-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 11m
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # The WAF (cloud LB / CDN) sits in front of the ingress controller.

networkPolicy:
  enabled: true

metrics:
  serviceMonitor:
    enabled: false   # requires the Prometheus Operator CRDs
    interval: 30s

topologySpread: true
