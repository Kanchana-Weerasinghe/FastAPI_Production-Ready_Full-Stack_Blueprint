global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    # If METRICS_TOKEN is set on the server, add:
    # authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics-token }
    static_configs:
      - targets: ["server:8000"]
